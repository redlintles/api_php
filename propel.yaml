propel:
  database:
    connections:
      default:
        adapter: mysql
        dsn: mysql:host=%env.DB_HOST%;dbname=%env.DB_NAME%;port=%env.DB_PORT%
        user: "%env.DB_USER%"
        password: "%env.DB_PASSWORD%"
  runtime:
    defaultConnection: default
    connections:
      - default
  generator:
    defaultConnection: default
    connections:
      - default
